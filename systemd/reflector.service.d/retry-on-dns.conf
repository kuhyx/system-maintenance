# Installed by setup_periodic_system.sh from github.com/kuhyx/system-maintenance.
# reflector runs at boot, before DNS works on this PC, and then sat in
# `systemctl --failed` with "Temporary failure in name resolution".
[Unit]
StartLimitIntervalSec=900
StartLimitBurst=5

[Service]
Restart=on-failure
RestartSec=60

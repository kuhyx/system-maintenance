# home-tidy manifest: what ~ is allowed to contain, where everything else
# goes, and how the one-shot migration re-points what references it.
#
# Read by bin/home_tidy.py. Paths are relative to $HOME unless absolute.
# Rationale and the research behind the layout:
# ~/.claude/plans/ls-2142740-torrent-vast-moon.md (Bergman et al. 2010:
# an extra folder level costs ~21x an extra item, so buckets are flat).

[root]
# The only visible entries ~ may hold. Everything else is swept to inbox/.
allow = [
  "src", "vendor", "services", "data", "media", "games", "sdk",
  "archive", "inbox", "Downloads", "Documents",
]
# Buckets whose direct children must be git repositories.
git_only = ["src", "vendor"]
# Warn (never fail) when a bucket holds more than this many entries
# (Bergman 2010 heuristic) -- except the buckets the layout made broad on
# purpose: an extra level costs ~21x an extra item, so 55 repos in one
# src/ is the design, not a finding.
warn_bucket_size = 21
broad_buckets = ["src", "data", "archive", "inbox", "Downloads"]

[sweep]
# A root entry younger than this is left alone (something may still be
# writing it).
grace_minutes = 60
# Refuse to sweep anything larger than this; report it instead.
max_entry_bytes = 1073741824
max_entry_count = 500
# Inbox items older than this are nagged about at login. Never deleted.
inbox_nag_days = 14
# sweep runs as --dry-run until this many hours after the timer install.
dry_run_hours_after_install = 24

[bridges]
# Symlinks left at old paths after the migration. Filled by `migrate
# --apply`; empty means no bridges exist.
expires = ""
paths = []
[xdg]
# user-dirs.dirs values the migration writes. The bug being fixed: every
# one of these pointed at "$HOME/", which is why Steam launchers and app
# documents landed in ~ root.
DESKTOP = "$HOME/inbox"
DOWNLOAD = "$HOME/Downloads"
DOCUMENTS = "$HOME/Documents"
TEMPLATES = "$HOME/.local/share/templates"
PUBLICSHARE = "$HOME/.local/share/public"
MUSIC = "$HOME/media/music"
PICTURES = "$HOME/media/pictures"
VIDEOS = "$HOME/media/videos"

[env]
# Exports appended to ~/.zshenv (idempotent block) because these tools
# find their trees by convention, not by any greppable config file.
GOPATH = "$HOME/sdk/go"
ANDROID_HOME = "$HOME/sdk/Android/Sdk"
ANDROID_SDK_ROOT = "$HOME/sdk/Android/Sdk"
FVM_CACHE_PATH = "$HOME/sdk/fvm"
NLTK_DATA = "$HOME/data/nltk_data"

[refs]
# Text files under these roots (globs allowed) are rewritten (old -> new).
# ~/.claude is listed piecewise: its histories, caches and transcripts are
# not live references and must stay untouched.
user_roots = [
  "~/.config/systemd/user", "~/.local/bin", "~/.config/i3",
  "~/.config/dufs", "~/.config/keepass-sync", "~/.config/VirtualBox",
  "~/.config/toolport", "~/.config/flutter", "~/.config/autostart",
  "~/.local/share/applications",
  "~/.claude/CLAUDE.md", "~/.claude/settings.json", "~/.claude/settings.local.json",
  "~/.claude/mcp-merge.json", "~/.claude/mcp-parked.json",
  "~/.claude/memories", "~/.claude/rules", "~/.claude/skills", "~/.claude/hooks",
  "~/.claude/scripts", "~/.claude/agents", "~/.claude/templates",
  "~/.claude/mcp-optional", "~/.claude/disabled-units", "~/.claude/session-env",
  "~/.claude/projects/*/memory",
]
user_files = ["~/.zshrc", "~/.zshenv", "~/.zprofile", "~/.bashrc", "~/.profile"]
# Globs for roots too big to walk (the user site-packages hold the 7 pip
# editable installs whose .pth/finder/direct_url carry the project path).
user_globs = [
  "~/.local/lib/python3*/site-packages/*.pth",
  "~/.local/lib/python3*/site-packages/__editable__*.py",
  "~/.local/lib/python3*/site-packages/*.dist-info/direct_url.json",
  # Out-of-tree venvs (e.g. ~/.local/share/freedays/venv) carrying editable
  # installs of repos that moved.
  "~/.local/share/*/venv/pyvenv.cfg", "~/.local/share/*/venv/bin/*",
  "~/.local/share/*/venv/lib/python3*/site-packages/*.pth",
  "~/.local/share/*/venv/lib/python3*/site-packages/__editable__*.py",
  "~/.local/share/*/venv/lib/python3*/site-packages/*.dist-info/direct_url.json",
  "~/.local/share/*/.venv/pyvenv.cfg", "~/.local/share/*/.venv/bin/*",
  "~/.local/share/*/.venv/lib/python3*/site-packages/*.pth",
  "~/.local/share/*/.venv/lib/python3*/site-packages/__editable__*.py",
  "~/.local/share/*/.venv/lib/python3*/site-packages/*.dist-info/direct_url.json",
]
# Same, but owned by root: rewritten through `sudo` with the diff shown first.
sudo_roots = ["/etc/systemd/system", "/usr/local/bin"]
# JSON whose string values are rewritten only under these top-level keys.
claude_json = "~/.claude.json"
claude_json_keys = ["mcpServers", "projects"]
# Inside every moved repo: tracked files (git ls-files) plus these
# untracked-but-live globs. Venvs are not relocatable by design (absolute
# shebangs, VIRTUAL_ENV=, editable .pth) so their text files are rewritten too.
repo_untracked_globs = [
  ".git/config", ".git/hooks/*", ".env", ".env.*", "*.env", ".api_token",
  "android/local.properties",
  ".venv/pyvenv.cfg", ".venv/bin/*", ".venv/lib/python*/site-packages/*.pth",
  ".venv/lib/python*/site-packages/__editable__*.py",
  ".venv/lib/python*/site-packages/*.dist-info/direct_url.json",
  "venv/pyvenv.cfg", "venv/bin/*", "venv/lib/python*/site-packages/*.pth",
  ".ci-mirror-venv/pyvenv.cfg", ".ci-mirror-venv/bin/*",
  ".ci-mirror-venv/lib/python*/site-packages/*.pth",
  ".ci-mirror-venv/lib/python*/site-packages/__editable__*.py",
  "*/.venv/pyvenv.cfg", "*/.venv/bin/*",
]
# Directory names skipped while walking roots (caches, histories, venvs
# outside repos) and file suffixes never rewritten (session transcripts).
prune_dirs = [
  ".git", "node_modules", "__pycache__", ".venv", "venv", ".ci-mirror-venv",
  ".cache", "build", ".dart_tool",
  "file-history", "chrome", "cache", "plugins", "backups", "logs",
  "paste-cache", "handoff", "tasks", "uploads", "memories.bak", "jobs",
  "sessions", "shell-snapshots", "debug", "statsig", "todos", "autopsy", "plans",
]
# Claude Code keys per-project memory by the sanitised project path
# (~/.claude/projects/-home-kuhy-todo). Those directories are renamed to
# follow the repo, or every project's memory would be orphaned.
claude_projects_dir = "~/.claude/projects"
prune_suffixes = [".jsonl"]
# Non-repo moved dirs (services, data) are not walked whole; only these
# config-shaped files up to two levels down are inspected.
nongit_globs = [
  "*.yml", "*.yaml", "*.toml", "*.json", "*.env", ".env", "*.sh", "*.service",
  "*.timer", "*.conf", "*.ini", "*.desktop", "Caddyfile", "*.py",
  "*/*.yml", "*/*.yaml", "*/*.toml", "*/*.json", "*/*.env", "*/.env", "*/*.sh",
  "*/*.service", "*/*.conf", "*/Caddyfile", "*/.runner", "*/.path",
  "*", "*/*",
]
# Never rewrite files larger than this or containing NUL bytes.
max_file_bytes = 5000000


# ---------------------------------------------------------------------------
# Per-entry hooks: commands a text rewrite cannot replace. `before` runs
# before the entry moves, `after` runs after every rewrite is done. Paths
# in commands are written against the NEW layout. `sudo = true` marks
# root steps, which `--plan` prints as one block.
# ---------------------------------------------------------------------------
[[hook]]
entry = "gitea"
before = ["docker compose -f ~/services/gitea/docker-compose.yml down"]
after = ["docker compose -f ~/services/gitea/docker-compose.yml up -d"]

[[hook]]
entry = "searxng"
before = ["docker compose -f ~/services/searxng/docker-compose.yml down"]
after = ["docker compose -f ~/services/searxng/docker-compose.yml up -d"]

[[hook]]
entry = "syncyomi"
before = ["docker compose -f ~/services/syncyomi/docker-compose.yml down"]
after = ["docker compose -f ~/services/syncyomi/docker-compose.yml up -d"]

[[hook]]
entry = "kcd2-dice-serve"
before = ["docker compose -f ~/services/kcd2-dice-serve/docker-compose.yml down"]
after = ["docker compose -f ~/services/kcd2-dice-serve/docker-compose.yml up -d"]

[[hook]]
entry = "personal-website-serve"
before = ["docker compose -f ~/services/personal-website-serve/docker-compose.yml down"]
after = ["docker compose -f ~/services/personal-website-serve/docker-compose.yml up -d"]

[[hook]]
entry = "testsAndMisc"
before = ["docker compose -f ~/src/testsAndMisc/endurain/docker-compose.yml down"]
after = ["docker compose -f ~/src/testsAndMisc/endurain/docker-compose.yml up -d"]

[[hook]]
# Started ad hoc by signal-bot/scripts/register_bot.sh (no compose project);
# the bind mount is baked into the container, so it must be recreated.
entry = "signal-api"
before = ["docker rm -f signal-api"]
after = [
  "docker run -d --name signal-api --restart=always -p 9922:8080 -v ~/services/signal-api:/home/.local/share/signal-cli -e MODE=json-rpc bbernhard/signal-cli-rest-api:1787779383-ci",
]

[[hook]]
entry = "actions-runner"
sudo = true
before = ["systemctl stop actions.runner.kuhyx-aseprite-mcp.kuhy-aseprite-runner.service"]
after = [
  "bash -c 'cd ~/services/actions-runner/aseprite-mcp && sudo ./svc.sh uninstall && sudo ./svc.sh install kuhy && sudo ./svc.sh start'",
]

[[hook]]
# The four vmbox shares bind-mount these repos; a mounted tree cannot move.
entry = "levels-of-typing"
sudo = true
before = ["umount ~/.local/share/vmbox/share/levels-of-typing"]
after = []

[[hook]]
entry = "platformer"
sudo = true
before = ["umount ~/.local/share/vmbox/share/platformer"]
after = []

[[hook]]
entry = "car-rental-sim"
sudo = true
before = ["umount ~/.local/share/vmbox/share/car-rental-sim"]
after = []

[[hook]]
entry = "home-guard"
sudo = true
before = ["umount ~/.local/share/vmbox/share/home-guard"]
after = []

[rebind]
# Run once after all moves and rewrites, in this order.
user = [
  "systemctl --user daemon-reload",
  "i3-msg reload",
  "update-desktop-database ~/.local/share/applications",
]
sudo = ["systemctl daemon-reload"]
# Units restarted after daemon-reload (only if currently active).
restart_user_units = [
  "endurain-import.service", "syncyomi-guard.service", "morning-routine.service",
  "freedays-sync.service", "workout-locker.service", "workout-sync.service",
  "screen-locker-web.service", "diet-guard-gate.service", "diet-guard-sync.service",
  "home-guard-gate.service", "leetcode-guard.service", "leetcode-guard-web.service",
  "wake-alarm-trigger.service", "steam-backlog-enforcer-web.service",
  "signal-bot.service", "signal-bot-manage.service", "signal-api-watchdog.service",
  "signal-jsonrpc-rebind.service", "kcd2-dice-build.service",
]
# Not listed on purpose: claude-remote-control.service (would cut the live
# remote session) and steam-backlog-enforcer.service (never bounce the
# enforcer while Steam runs) — both pick up the new paths on their next
# natural restart; their unit files are rewritten like every other.
restart_sudo_units = [
  "dufs.service", "media-cloud-sync.path", "media-organizer.service",
  "nftables-drift.timer",
]
# Repos whose rewritten files are committed (narrow `git add` of exactly the
# rewritten tracked files; each repo's pre-commit hooks are the gate; CI runs
# the suites on push) then pushed in one batch. utils first (it owns every
# other repo's gate), then testsAndMisc. Set finish_script to
# ~/.claude/scripts/finish_auto.sh to run every repo's full test suite
# serially instead.
commit_order_first = ["src/utils", "src/testsAndMisc"]
finish_script = ""
